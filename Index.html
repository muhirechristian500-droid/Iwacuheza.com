<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iwacuheza | Find Your Perfect Home</title>

  <meta name="description"
        content="Iwacuheza helps you discover beautiful and affordable homes, apartments and places to rent.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #1d2939;
    }

    /* HEADER */
    header {
      background: #075e45;
      color: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    /* HERO */
    .hero {
      min-height: 520px;
      padding: 70px 20px;
      text-align: center;
      color: white;

      background:
        linear-gradient(
          rgba(0,0,0,0.55),
          rgba(0,0,0,0.55)
        ),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80");

      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      font-size: 42px;
      max-width: 700px;
      margin: 50px auto 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    /* SEARCH */
    .search-box {
      background: white;
      max-width: 850px;
      margin: auto;
      padding: 15px;
      border-radius: 14px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .search-box input,
    .search-box select {
      flex: 1;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    .search-btn {
      background: #f5a623;
      border: none;
      color: white;
      padding: 15px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* SECTIONS */
    section {
      padding: 55px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-title h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #667085;
    }

    /* PROPERTY CARDS */
    .properties {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
    }

    .card-content {
      padding: 18px;
    }

    .card-content h3 {
      margin-bottom: 8px;
    }

    .location {
      color: #667085;
      margin-bottom: 12px;
    }

    .price {
      color: #075e45;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .view-btn {
      display: block;
      text-align: center;
      background: #075e45;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    /* WHY US */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      text-align: center;
    }

    .feature {
      background: white;
      padding: 30px 20px;
      border-radius: 14px;
    }

    .feature-icon {
      font-size: 38px;
      margin-bottom: 15px;
    }

    /* CTA */
    .cta {
      background: #075e45;
      color: white;
      max-width: none;
      text-align: center;
    }

    .cta h2 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .cta p {
      margin-bottom: 25px;
    }

    .whatsapp {
      display: inline-block;
      background: #25d366;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    /* FOOTER */
    footer {
      background: #101828;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    /* MOBILE */
    @media (max-width: 750px) {

      .nav a {
        display: none;
      }

      .hero {
        min-height: 600px;
      }

      .hero h1 {
        font-size: 32px;
        margin-top: 30px;
      }

      .search-box {
        flex-direction: column;
      }

      .properties {
        grid-template-columns: 1fr;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="nav">
      <div class="logo">🏡 Iwacuheza</div>

      <div>
        <a href="#home">Home</a>
        <a href="#properties">Homes</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </header>

  <div class="hero" id="home">

        </div>
